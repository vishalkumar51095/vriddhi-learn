server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: learning-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vriddhi_learning}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:vishal}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Must match auth-service's jwt.secret — both services verify tokens signed
# with the same key, without calling Auth on every request.
jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-every-environment-please}
  issuer: vriddhi-learn

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  level:
    com.vriddhi.learning: INFO

learning:
  bootstrap:
    # Loads every classpath:lessons/*.md file at startup (insert new, update changed, skip unchanged).
    enabled: ${LESSON_BOOTSTRAP_ENABLED:true}
